name: image

# Build the image on every push to main and publish it to GHCR (GitHub
# Container Registry). The home server pulls this image and builds nothing.
#
# A release tag (vX.Y.Z, or vX.Y.Z-<pre-release>) builds nothing: it adds the
# version as a tag to the image that main already built for that commit, so a
# release runs exactly the image that was built and checked on main.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  publish:
    name: publish image
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      # The steps need no git credentials. Keep the token out of .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cloveclovedev/press-start:${{ github.sha }}
            ghcr.io/cloveclovedev/press-start:latest
          # Links the package to this repository on GHCR.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  release:
    name: tag release image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: add the version to the image of the commit
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          IMAGE: ghcr.io/cloveclovedev/press-start
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$VERSION is not vX.Y.Z or vX.Y.Z-<pre-release>"
            exit 1
          fi
          if ! docker buildx imagetools inspect "$IMAGE:$COMMIT" > /dev/null; then
            echo "::error::no image $IMAGE:$COMMIT; tag a commit that main has built"
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$COMMIT"
