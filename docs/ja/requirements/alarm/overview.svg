<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="881px" preserveAspectRatio="none" style="width:859px;height:881px;background:#FFFFFF;" version="1.1" viewBox="0 0 859 881" width="859px" zoomAndPan="magnify"><title>Wake-up run</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="101.2061" x="372.2826" y="22.9951">Wake-up run</text></g><ellipse cx="430.05" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="Waiting"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="247.0859" x="306.51" y="124.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="306.51" x2="553.5959" y1="150.5938" y2="150.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.4502" x="403.3279" y="142.292">Waiting</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.1445" x="311.51" y="166.7324">wake time = earlier of</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.0859" x="311.51" y="180.7012">(first event - lead time, alarm setting)</text></g><g id="Ringing"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73.0264" x="217.54" y="265.5369"/><line style="stroke:#181818;stroke-width:0.5;" x1="217.54" x2="290.5664" y1="291.8338" y2="291.8338"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.0264" x="227.54" y="283.532">Ringing</text></g><g id="Watching"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="242.1113" x="264.99" y="676.7969"/><line style="stroke:#181818;stroke-width:0.5;" x1="264.99" x2="507.1013" y1="703.0938" y2="703.0938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.1309" x="352.9802" y="694.792">Watching</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.1113" x="269.99" y="719.2324">back-to-bed window (default 30 min)</text></g><g id="Briefing"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="158.0996" x="392" y="407.5369"/><line style="stroke:#181818;stroke-width:0.5;" x1="392" x2="550.0996" y1="433.8337" y2="433.8337"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54.4414" x="443.8291" y="425.532">Briefing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.0996" x="397" y="449.9724">always read to the end</text></g><g id="Interval"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73.6143" x="196.24" y="549.7969"/><line style="stroke:#181818;stroke-width:0.5;" x1="196.24" x2="269.8543" y1="576.0938" y2="576.0938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.6143" x="206.24" y="567.792">Interval</text></g><ellipse cx="281.05" cy="839.3269" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="281.05" cy="839.3269" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="19" data-uid="ent0003" id="entity_GMN2"><path d="M352.71,804.0669 L352.71,874.5981 L631.3931,874.5981 L631.3931,814.0669 L621.3931,804.0669 L352.71,804.0669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M621.3931,804.0669 L621.3931,814.0669 L631.3931,814.0669 L621.3931,804.0669" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.1094" x="358.71" y="821.1338">Judged asleep and judged awake</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.6831" x="358.71" y="836.2666">come from the bed state (PS-BED-008):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.5317" x="358.71" y="851.3994">asleep after 5 min in bed (default),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.7378" x="358.71" y="866.5322">awake as soon as out of bed.</text></g><!--link *start* to Waiting--><g class="link" data-entity-1=".start." data-entity-2="Waiting" data-source-line="4" data-uid="lnk4" id="link_.start._Waiting"><path d="M430.05,63.6269 C430.05,77.2269 430.05,97.1169 430.05,117.9469" fill="none" id="*start*-to-Waiting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="430.05,123.9469,434.05,114.9469,430.05,118.9469,426.05,114.9469,430.05,123.9469" style="stroke:#181818;stroke-width:1;"/></g><!--link Waiting to Ringing--><g class="link" data-entity-1="Waiting" data-entity-2="Ringing" data-source-line="6" data-uid="lnk6" id="link_Waiting_Ringing"><path d="M388.34,188.7269 C357.23,212.0769 320.1386,239.925 291.4686,261.445" fill="none" id="Waiting-to-Ringing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="286.67,265.0469,296.2691,262.8431,290.6688,262.0453,291.4666,256.445,286.67,265.0469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.229" x="348.33" y="231.6038">wake time, judged asleep</text></g><!--link Waiting to Watching--><g class="link" data-entity-1="Waiting" data-entity-2="Watching" data-source-line="7" data-uid="lnk8" id="link_Waiting_Watching"><path d="M554.07,174.9669 C618.55,191.8569 684.05,224.9169 684.05,289.5369 C684.05,289.5369 684.05,289.536