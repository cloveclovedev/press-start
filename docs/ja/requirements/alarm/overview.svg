<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="881px" preserveAspectRatio="none" style="width:618px;height:881px;background:#FFFFFF;" version="1.1" viewBox="0 0 618 881" width="618px" zoomAndPan="magnify"><title>Wake-up run</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="101.2061" x="251.4983" y="22.9951">Wake-up run</text></g><ellipse cx="297.05" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="Waiting"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="247.0859" x="173.51" y="124.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="173.51" x2="420.5959" y1="150.5938" y2="150.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.4502" x="270.3279" y="142.292">Waiting</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.1445" x="178.51" y="166.7324">wake time = earlier of</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.0859" x="178.51" y="180.7012">(first event - lead time, alarm setting)</text></g><g id="Ringing"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73.0264" x="260.54" y="265.5369"/><line style="stroke:#181818;stroke-width:0.5;" x1="260.54" x2="333.5664" y1="291.8338" y2="291.8338"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.0264" x="270.54" y="283.532">Ringing</text></g><g id="Briefing"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="158.0996" x="7" y="407.5369"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="165.0996" y1="433.8337" y2="433.8337"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54.4414" x="58.8291" y="425.532">Briefing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.0996" x="12" y="449.9724">always read to the end</text></g><g id="Interval"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73.6143" x="255.24" y="549.7969"/><line style="stroke:#181818;stroke-width:0.5;" x1="255.24" x2="328.8543" y1="576.0938" y2="576.0938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.6143" x="265.24" y="567.792">Interval</text></g><g id="Watching"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="242.1113" x="170.99" y="676.7969"/><line style="stroke:#181818;stroke-width:0.5;" x1="170.99" x2="413.1013" y1="703.0938" y2="703.0938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.1309" x="258.9802" y="694.792">Watching</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.1113" x="175.99" y="719.2324">back-to-bed window (default 30 min)</text></g><ellipse cx="187.05" cy="839.3269" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="187.05" cy="839.3269" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="18" data-uid="ent0003" id="entity_GMN2"><path d="M258.71,804.0669 L258.71,874.5981 L537.3931,874.5981 L537.3931,814.0669 L527.3931,804.0669 L258.71,804.0669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M527.3931,804.0669 L527.3931,814.0669 L537.3931,814.0669 L527.3931,804.0669" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.1094" x="264.71" y="821.1338">Judged asleep and judged awake</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.6831" x="264.71" y="836.2666">come from the bed state (PS-BED-008):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.5317" x="264.71" y="851.3994">asleep after 5 min in bed (default),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.7378" x="264.71" y="866.5322">awake as soon as out of bed.</text></g><!--link *start* to Waiting--><g class="link" data-entity-1=".start." data-entity-2="Waiting" data-source-line="4" data-uid="lnk4" id="link_.start._Waiting"><path d="M297.05,63.6269 C297.05,77.2269 297.05,97.1169 297.05,117.9469" fill="none" id="*start*-to-Waiting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="297.05,123.9469,301.05,114.9469,297.05,118.9469,293.05,114.9469,297.05,123.9469" style="stroke:#181818;stroke-width:1;"/></g><!--link Waiting to Ringing--><g class="link" data-entity-1="Waiting" data-entity-2="Ringing" data-source-line="6" data-uid="lnk6" id="link_Waiting_Ringing"><path d="M297.05,188.7269 C297.05,212.0769 297.05,237.5269 297.05,259.0469" fill="none" id="Waiting-to-Ringing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="297.05,265.0469,301.05,256.0469,297.05,260.0469,293.05,256.0469,297.05,265.0469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.6279" x="298.05" y="231.6038">wake time</text></g><!--link Ringing to Briefing--><g class="link" data-entity-1="Ringing" data-entity-2="Briefing" data-source-line="7" data-uid="lnk8" id="link_Ringing_Briefing"><path d="M260.2,295.4869 C205.12,302.2269 105.49,317.9869 84.05,345.5369 C70.64,362.7669 71.7401,382.5322 76.3901,401.3422" fill="none" id="Ringing-to-Briefing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="77.83,407.1669,79.5532,397.4699,76.6301,402.313,71.787,399.3898,77.83,407.1669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.8276" x="85.05" y="358.6038">alarm sound length elapsed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.2593" x="123.8342" y="373.7366">or judged awake</text></g><!--link Briefing to Interval--><g class="link" data-entity-1="Briefing" data-entity-2="Interval" data-source-line="9" data-uid="lnk10" id="link_Briefing_Interval"><path d="M77.26,458.2969 C72.22,477.1869 69.32,502.8069 83.05,519.7969 C123.06,569.2869 161.77,532.6469 223.05,549.7969 C233.55,552.7369 239.1238,554.4436 249.4038,558.0236" fill="none" id="Briefing-to-Interval" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="255.07,559.9969,247.8862,553.2595,250.3481,558.3525,245.2551,560.8145,255.07,559.9969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.0625" x="84.05" y="508.3638">briefing done, judged asleep</text></g><!--link Briefing to Watching--><g class="link" data-entity-1="Briefing" data-entity-2="Watching" data-source-line="10" data-uid="lnk12" id="link_Briefing_Watching"><path d="M70.36,458.0769 C50.43,492.4969 21.92,555.9869 51.05,599.7969 C78.18,640.6069 119.5955,663.1579 165.0255,677.6979" fill="none" id="Briefing-to-Watching" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="170.74,679.5269,163.3876,672.9738,165.978,678.0028,160.949,680.5931,170.74,679.5269" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.5547" x="52.05" y="579.3638">briefing done, judged awake</text></g><!--link Interval to Ringing--><g class="link" data-entity-1="Interval" data-entity-2="Ringing" data-source-line="11" data-uid="lnk13" id="link_Interval_Ringing"><path d="M292.48,549.3969 C293.43,495.8869 295.574,374.7959 296.514,321.5959" fill="none" id="Interval-to-Ringing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="296.62,315.5969,292.4616,324.5248,296.5317,320.5961,300.4604,324.6661,296.62,315.5969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.1465" x="295.96" y="429.7338">judged asleep after interval</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.6772" x="310.1946" y="444.8666">(louder, up to the limit)</text></g><!--link Interval to Watching--><g class="link" data-entity-1="Interval" data-entity-2="Watching" data-source-line="12" data-uid="lnk14" id="link_Interval_Watching"><path d="M292.05,600.2269 C292.05,622.2769 292.05,648.5369 292.05,670.5669" fill="none" id="Interval-to-Watching" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="292.05,676.5669,296.05,667.5669,292.05,671.5669,288.05,667.5669,292.05,676.5669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.8286" x="293.05" y="642.8638">judged awake</text></g><!--link Watching to Ringing--><g class="link" data-entity-1="Watching" data-entity-2="Ringing" data-source-line="14" data-uid="lnk15" id="link_Watching_Ringing"><path d="M351.77,676.3569 C366.19,668.4469 380.69,658.6069 392.05,646.7969 C456.95,579.3269 463.83,548.9869 485.05,457.7969 C490.11,436.0369 495.94,427.0469 485.05,407.5369 C452.81,349.7669 384.3471,319.089 339.4071,303.979" fill="none" id="Watching-to-Ringing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="333.72,302.0669,340.9759,308.7266,338.4593,303.6603,343.5255,301.1437,333.72,302.0669" style="str