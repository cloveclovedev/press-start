<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="911px" preserveAspectRatio="none" style="width:848px;height:911px;background:#FFFFFF;" version="1.1" viewBox="0 0 848 911" width="848px" zoomAndPan="magnify"><title>Wake-up run</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="101.2061" x="366.6476" y="22.9951">Wake-up run</text></g><ellipse cx="467.78" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="Waiting"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="247.0859" x="344.24" y="124.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="344.24" x2="591.3259" y1="150.5938" y2="150.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.4502" x="441.0579" y="142.292">Waiting</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.1445" x="349.24" y="166.7324">wake time = earlier of</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.0859" x="349.24" y="180.7012">(first event - lead time, alarm setting)</text></g><g id="Ringing"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73.0264" x="140.27" y="280.5369"/><line style="stroke:#181818;stroke-width:0.5;" x1="140.27" x2="213.2964" y1="306.8338" y2="306.8338"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.0264" x="150.27" y="298.532">Ringing</text></g><g id="Watching"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="242.1113" x="183.73" y="706.7969"/><line style="stroke:#181818;stroke-width:0.5;" x1="183.73" x2="425.8413" y1="733.0938" y2="733.0938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.1309" x="271.7202" y="724.792">Watching</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.1113" x="188.73" y="749.2324">back-to-bed window (default 30 min)</text></g><g id="Briefing"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="158.0996" x="380.73" y="422.5369"/><line style="stroke:#181818;stroke-width:0.5;" x1="380.73" x2="538.8296" y1="448.8337" y2="448.8337"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54.4414" x="432.5591" y="440.532">Briefing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.0996" x="385.73" y="464.9724">always read to the end</text></g><g id="Interval"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73.6143" x="139.98" y="564.7969"/><line style="stroke:#181818;stroke-width:0.5;" x1="139.98" x2="213.5943" y1="591.0938" y2="591.0938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.6143" x="149.98" y="582.792">Interval</text></g><ellipse cx="199.78" cy="869.3269" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="199.78" cy="869.3269" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="20" data-uid="ent0003" id="entity_GMN2"><path d="M271.44,834.0669 L271.44,904.5981 L550.1231,904.5981 L550.1231,844.0669 L540.1231,834.0669 L271.44,834.0669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M540.1231,834.0669 L540.1231,844.0669 L550.1231,844.0669 L540.1231,834.0669" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.1094" x="277.44" y="851.1338">Judged asleep and judged awake</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.6831" x="277.44" y="866.2666">come from the bed state (PS-BED-008):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.5317" x="277.44" y="881.3994">asleep after 5 min in bed (default),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.7378" x="277.44" y="896.5322">awake as soon as out of bed.</text></g><!--link *start* to Waiting--><g class="link" data-entity-1=".start." data-entity-2="Waiting" data-source-line="4" data-uid="lnk4" id="link_.start._Waiting"><path d="M467.78,63.6269 C467.78,77.2269 467.78,97.1169 467.78,117.9469" fill="none" id="*start*-to-Waiting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="467.78,123.9469,471.78,114.9469,467.78,118.9469,463.78,114.9469,467.78,123.9469" style="stroke:#181818;stroke-width:1;"/></g><!--link Waiting to Ringing--><g class="link" data-entity-1="Waiting" data-entity-2="Ringing" data-source-line="6" data-uid="lnk6" id="link_Waiting_Ringing"><path d="M343.75,167.6569 C273.57,176.3069 195.58,191.7469 173.78,218.5369 C159.92,235.5669 161.4048,255.6046 166.5148,274.5146" fill="none" id="Waiting-to-Ringing" style="stroke:#D62728;stroke-width:2;"/><polygon fill="#D62728" points="168.08,280.3069,169.5937,270.575,166.7756,275.48,161.8707,272.662,168.08,280.3069" style="stroke:#D62728;stroke-width:2;"/><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.0503" x="174.78" y="231.6038">wake time moved earlier into the past</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.7241" x="195.9431" y="246.7366">(rings within 1 min, once a day)</text></g><!--link Waiting to Ringing--><g class="link" data-entity-1="Waiting" data-entity-2="Ringing" data-source-line="7" data-uid="lnk7" id="link_Waiting_Ringing"><path d="M462.43,188.6869 C457.28,209.2369 447.4,235.0869 428.78,250.5369 C396.33,277.4669 281.0034,293.3549 219.2934,300.2049" fill="none" id="Waiting-to-Ringing-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="213.33,300.8669,222.7164,303.8495,218.2995,300.3152,221.8338,295.8984,213.33,300.8669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.229" x="452.28" y="231.6038">wake time, judged asleep</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.2002" x="464.7944" y="246.7366">or bed state unknown</text></g><!--link Waiting to Watching--><g class="link" data-entity-1="Waiting" data-entity-2="Watching" data-source-line="8" data-uid="lnk9" id="link_Waiting_Watching"><path d="M581.68,188.9969 C598.31,196.8669 614.34,206.5769 627.78,218.5369 C660.02,247.1969 672.78,261.3969 672.78,304.5369 C672.78,304.5369 672.78,304.5369 672.78,590.7969 C672.78,644.6369 539.3531,683.9924 432.1631,707.2924" fill="none" id="Waiting-to-Watching" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="426.3,708.5669,435.9443,710.5639,431.1859,707.5048,434.245,702.7465,426.3,708.5669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.7212" x="673.78" y="444.7338">wake time, judged awake</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.1987" x="696.0412" y="459.8666">(nothing is played)</text></g><!--link Ringing to Briefing--><g class="link" data-entity-1="Ringing" data-entity-2="Briefing" data-source-line="9" data-uid="lnk11" id="link_Ringing_Briefing"><path d="M213.78,324.8569 C264.05,349.7469 348.6933,391.6539 404.7833,419.4339" fill="none" id="Ringing-to-Briefing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="410.16,422.0969,403.8703,414.518,405.6794,419.8778,400.3197,421.6869,410.16,422.0969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.8276" x="350.9332" y="373.6038">alarm sound length elapsed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.4341" x="344.63" y="388.7366">judged awake, or stop request</text></g><!--link Briefing to Interval--><g class="link" data-entity-1="Briefing" data-entity-2="Interval" data-source-line="11" data-uid="lnk13" id="link_Briefing_Interval"><path d="M380.49,466.7669 C371.49,468.8069 362.44,470.8569 353.78,472.7969 C293.82,486.2869 267.05,464.7469 218.78,502.7969 C199.34,518.1269 190.013,538.9966 184.183,558.5666" fill="none" id="Briefing-to-Interval" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="182.47,564.3169,188.8731,556.8335,183.8975,559.525,181.206,554.5495,182.47,564.3169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.0625" x="219.78" y="523.3638">briefing done, judged asleep</text></g><!--link Briefing to Watching--><g class="link" data-entity-1="Briefing" data-entity-2="Watching" data-source-line="12" data-uid="lnk14" id="link_Briefing_Watching"><path d="M461.02,473.0969 C462.02,518.1469 458.05,615.2869 410.78,676.7969 C401.34,689.0869 393.5708,695.9055 379.9008,703.5255" fill="none" id="Briefing-to-Watching" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="374.66,706.4469,384.4687,705.5587,379.0273,704.0124,380.5736,698.571,374.66,706.4469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.5547" x="455.2" y="594.3638">briefing done, judged awake</text></g><!--link Interval to Ringing--><g class="link" data-entity-1="Interval" data-entity-2="Ringing" data-source-line="13" data-uid="lnk15" id="link_Interval_Ringing"><path d="M176.78,564.3969 C176.78,510.8869 176.78,389.7969 176.78,336.5969" fill="none" id="Interval-to-Ringing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="176.78,330.5969,172.78,339.5969,176.78,335.5969,180.78,339.5969,176.78,330.5969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.1465" x="177.78" y="444.7338">judged asleep after interval</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.6772" x="192.0146" y="459.8666">(louder, up to the limit)</text></g><!--link Interval to Watching--><g class="link" data-entity-1="Interval" data-entity-2="Watching" data-source-line="14" data-uid="lnk16" id="link_Interval_Watching"><path d="M168.79,615.1269 C164.3,633.5969 161.74,658.7969 173.78,676.7969 C182.2,689.3769 188.8931,696.1086 202.1631,703.5286" fill="none" id="Interval-to-Watching" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="207.4,706.4569,201.4968,698.5732,203.0359,704.0167,197.5925,705.5558,207.4,706.4569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.9609" x="242.8047" y="657.8638">judged awake,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.0103" x="174.78" y="672.9966">or bed state unknown after interval</text></g><!--link Watching to Ringing--><g class="link" data-entity-1="Watching" data-entity-2="Ringing" data-source-line="16" data-uid="lnk17" id="link_Watching_Ringing"><path d="M214.65,706.3469 C194.62,698.6469 174.19,688.9069 156.78,676.7969 C88.72,629.4469 64.44,612.6069 35.78,534.7969 C6,453.9369 88.1939,374.4587 138.6839,334.528