<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="911px" preserveAspectRatio="none" style="width:862px;height:911px;background:#FFFFFF;" version="1.1" viewBox="0 0 862 911" width="862px" zoomAndPan="magnify"><title>Wake-up run</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="101.2061" x="373.6176" y="22.9951">Wake-up run</text></g><ellipse cx="432.72" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="Waiting"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="247.0859" x="309.17" y="124.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="309.17" x2="556.2559" y1="150.5938" y2="150.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.4502" x="405.9879" y="142.292">Waiting</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.1445" x="314.17" y="166.7324">wake time = earlier of</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.0859" x="314.17" y="180.7012">(first event - lead time, alarm setting)</text></g><g id="Ringing"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73.0264" x="220.2" y="280.5369"/><line style="stroke:#181818;stroke-width:0.5;" x1="220.2" x2="293.2264" y1="306.8338" y2="306.8338"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.0264" x="230.2" y="298.532">Ringing</text></g><g id="Watching"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="242.1113" x="197.66" y="706.7969"/><line style="stroke:#181818;stroke-width:0.5;" x1="197.66" x2="439.7713" y1="733.0938" y2="733.0938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.1309" x="285.6502" y="724.792">Watching</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.1113" x="202.66" y="749.2324">back-to-bed window (default 30 min)</text></g><g id="Briefing"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="158.0996" x="394.67" y="422.5369"/><line style="stroke:#181818;stroke-width:0.5;" x1="394.67" x2="552.7696" y1="448.8337" y2="448.8337"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54.4414" x="446.4991" y="440.532">Briefing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.0996" x="399.67" y="464.9724">always read to the end</text></g><g id="Interval"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73.6143" x="153.91" y="564.7969"/><line style="stroke:#181818;stroke-width:0.5;" x1="153.91" x2="227.5243" y1="591.0938" y2="591.0938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.6143" x="163.91" y="582.792">Interval</text></g><ellipse cx="213.72" cy="869.3269" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="213.72" cy="869.3269" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="19" data-uid="ent0003" id="entity_GMN2"><path d="M285.37,834.0669 L285.37,904.5981 L564.0531,904.5981 L564.0531,844.0669 L554.0531,834.0669 L285.37,834.0669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M554.0531,834.0669 L554.0531,844.0669 L564.0531,844.0669 L554.0531,834.0669" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.1094" x="291.37" y="851.1338">Judged asleep and judged awake</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.6831" x="291.37" y="866.2666">come from the bed state (PS-BED-008):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.5317" x="291.37" y="881.3994">asleep after 5 min in bed (default),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.7378" x="291.37" y="896.5322">awake as soon as out of bed.</text></g><!--link *start* to Waiting--><g class="link" data-entity-1=".start." data-entity-2="Waiting" data-source-line="4" data-uid="lnk4" id="link_.start._Waiting"><path d="M432.72,63.6269 C432.72,77.2269 432.72,97.1169 432.72,117.9469" fill="none" id="*start*-to-Waiting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="432.72,123.9469,436.72,114.9469,432.72,118.9469,428.72,114.9469,432.72,123.9469" style="stroke:#181818;stroke-width:1;"/></g><!--link Waiting to Ringing--><g class="link" data-entity-1="Waiting" data-entity-2="Ringing" data-source-line="6" data-uid="lnk6" id="link_Waiting_Ringing"><path d="M394.96,188.9769 C362.33,216.2469 320.4534,251.2486 290.5834,276.2186" fill="none" id="Waiting-to-Ringing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="285.98,280.0669,295.4506,277.3635,289.8162,276.86,290.3196,271.2256,285.98,280.0669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.229" x="356.25" y="231.6038">wake time, judged asleep</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.2002" x="368.7644" y="246.7366">or bed state unknown</text></g><!--link Waiting to Watching--><g class="link" data-entity-1="Waiting" data-entity-2="Watching" data-source-line="7" data-uid="lnk8" id="link_Waiting_Watching"><path d="M556.74,181.1069 C621.22,201.3869 686.72,238.2869 686.72,304.5369 C686.72,304.5369 686.72,304.5369 686.72,590.7969 C686.72,644.6369 553.2831,683.9924 446.0931,707.2924" fill="none" id="Waiting-to-Watching" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="440.23,708.5669,449.8743,710.5639,445.1159,707.5048,448.175,702.7465,440.23,708.5669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.7212" x="687.72" y="444.7338">wake time, judged awake</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.1987" x="709.9812" y="459.8666">(nothing is played)</text></g><!--link Ringing to Briefing--><g class="link" data-entity-1="Ringing" data-entity-2="Briefing" data-source-line="8" data-uid="lnk10" id="link_Ringing_Briefing"><path d="M293.53,330.3069 C333.07,355.8369 390.559,392.9729 430.589,418.8129" fill="none" id="Ringing-to-Briefing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="435.63,422.0669,430.2379,413.8252,431.4292,419.3552,425.8992,420.5465,435.63,422.0669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.8276" x="391.9532" y="373.6038">alarm sound length elapsed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.4341" x="385.65" y="388.7366">judged awake, or stop request</text></g><!--link Briefing to Interval--><g class="link" data-entity-1="Briefing" data-entity-2="Interval" data-source-line="10" data-uid="lnk12" id="link_Briefing_Interval"><path d="M394.43,466.7669 C385.42,468.8069 376.37,470.8569 367.72,472.7969 C307.75,486.2869 280.98,464.7469 232.72,502.7969 C213.27,518.1269 203.943,538.9966 198.113,558.5666" fill="none" id="Briefing-to-Interval" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="196.4,564.3169,202.8031,556.8335,197.8275,559.525,195.136,554.5495,196.4,564.3169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.0625" x="233.72" y="523.3638">briefing done, judged asleep</text></g><!--link Briefing to Watching--><g class="link" data-entity-1="Briefing" data-entity-2="Watching" data-source-line="11" data-uid="lnk13" id="link_Briefing_Watching"><path d="M474.95,473.0969 C475.95,518.1469 471.98,615.2869 424.72,676.7969 C415.27,689.0869 407.5117,695.9072 393.8317,703.5272" fill="none" id="Briefing-to-Watching" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="388.59,706.4469,398.399,705.5618,392.9581,704.0138,394.5061,698.5728,388.59,706.4469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.5547" x="469.13" y="594.3638">briefing done, judged awake</text></g><!--link Interval to Ringing--><g class="link" data-entity-1="Interval" data-entity-2="Ringing" data-source-line="12" data-uid="lnk14" id="link_Interval_Ringing"><path d="M187.83,564.3569 C184.72,531.4969 181.81,471.5369 194.72,422.5369 C203.67,388.5269 220.9654,358.4516 235.9754,335.9016" fill="none" id="Interval-to-Ringing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="239.3,330.9069,230.9833,336.1825,236.5295,335.0691,237.6429,340.6153,239.3,330.9069" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.1465" x="195.72" y="444.7338">judged asleep after interval</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.6772" x="209.9546" y="459.8666">(louder, up to the limit)</text></g><!--link Interval to Watching--><g class="link" data-entity-1="Interval" data-entity-2="Watchin